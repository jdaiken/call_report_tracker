name: Bulk download probe
on:
  push:
    branches: [claude/pipeline-field-spec]
    paths: [.github/workflows/bulk_probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import sys, traceback, requests; sys.path.insert(0, "scripts"); sys.path.insert(0, ".")
          from datetime import date
          import build_pipeline_spec as b
          s = requests.Session(); s.headers["User-Agent"] = b.UA
          r = s.get(b.BULK_URL, timeout=60)
          print("GET", r.status_code, r.headers.get("Content-Type"), len(r.content))
          print(r.text[:1500])
          import re
          print("selects:", re.findall(r'<select[^>]*name="([^"]+)"', r.text))
          print("submits:", re.findall(r'<input[^>]*type="submit"[^>]*>', r.text)[:10])
          print("radios:", re.findall(r'<input[^>]*type="radio"[^>]*>', r.text)[:10])
          try:
              import zipfile, io
              for q in (date(2026, 6, 30), date(2026, 9, 30)):
                  z = b.download_bulk(q); print("ZIP OK", q, len(z))
                  zf = zipfile.ZipFile(io.BytesIO(z))
                  for i in zf.infolist()[:60]: print("  ", i.filename, i.file_size)
                  print("  members:", len(zf.infolist()))
                  panel, conc = b.parse_bulk(z, b.wanted_codes())
                  print("  panel", len(panel), "banks", len(conc), list(panel.items())[:2])
                  print("  sample", list(conc.items())[:1])
          except Exception:
              traceback.print_exc()
          PY
