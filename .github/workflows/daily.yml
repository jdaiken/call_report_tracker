name: Daily FFIEC Call Report Monitor

on:
  schedule:
    # 13:00 UTC ~ 8-9am US Eastern, after FFIEC's overnight batch processing.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      universe:
        description: "small (enforcement-orders + risk-ranking bank lists) or full (all filers)"
        type: choice
        options: [full, small]
        default: full
      fake_diff:
        description: "Send a synthetic Tier 1 test email instead of hitting the FFIEC API"
        type: boolean
        default: false
      diagnose_secrets:
        description: "One-off: print safe metadata about FFIEC_USER_ID/FFIEC_TOKEN (never the value), skip the real run"
        type: boolean
        default: false
      runner_type:
        description: "TEMPORARY test knob: which runner to use for this manual run"
        type: choice
        options: [ubuntu-latest, self-hosted]
        default: ubuntu-latest
      reset_cursor:
        description: "TEMPORARY: clear poll_state before running, so retrieve_filer_statuses sees every filer again instead of a cursor an earlier crashed run already advanced"
        type: boolean
        default: false
      max_facsimile_pulls:
        description: "Cap how many changed institutions get a full facsimile pull this run (blank = no cap). Safe to use: uncapped coverage is picked up on the next run, nothing is lost -- see run_daily's docstring. Useful to bound a single run's wall-clock time on the full universe."
        type: string
        default: ""
      heartbeat:
        description: "TEMPORARY (a few days): email a short confirmation even when there's nothing to report, so a quiet inbox isn't mistaken for a scheduled run that never fired. Turn off once the live pipeline is trusted."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run:
    # NOTE: every 403 seen so far (on both hosted and self-hosted runners, with
    # both token states we've tested) was a generic Azure Application Gateway
    # HTML page, not FFIEC's documented JSON error shape -- i.e. the request was
    # rejected at the gateway/WAF before FFIEC's API logic ran, on every runner
    # type tried. Self-hosted was never actually confirmed necessary (an earlier
    # claim that a personal-network request succeeded was never actually tested).
    # ffiec_client.py just got a fix for one concrete, IP-independent candidate:
    # it was sending requests' default User-Agent, a known WAF "bad bot" trigger.
    # Default is now ubuntu-latest to test that fix cleanly; switch back to
    # self-hosted here only if a hosted run still 403s with this fix in place.
    runs-on: ${{ inputs.runner_type || 'ubuntu-latest' }}
    # The full ~4,500-institution universe's first-ever run is ~8,000+ throttled
    # facsimile pulls (see FFIECConfig.max_requests_per_hour in config.py) --
    # potentially hours. That's safe to let run long: run_daily only advances
    # poll_state's cursor for periods it actually finished covering this run,
    # so a run killed by this timeout just resumes where it left off on the
    # next scheduled fire, rather than losing coverage. 340 leaves headroom
    # under GitHub's 360-minute hard default so this step (not the platform)
    # is what ends it, and "Save DuckDB state" below still gets to run.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      # Skipped on self-hosted: its Windows installer needs HKLM registry
      # access that fails without admin rights on a non-elevated runner, and a
      # self-hosted runner is expected to bring its own toolchain anyway. Kept
      # for ubuntu-latest, which doesn't have that problem and isn't
      # guaranteed to have Python preinstalled the way a self-hosted runner does.
      - uses: actions/setup-python@v5
        if: ${{ (inputs.runner_type || 'ubuntu-latest') != 'self-hosted' }}
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
        shell: bash

      # The *.duckdb file is gitignored (spec §9) -- state persists across daily runs
      # via cache instead of being committed. restore-keys falls back to the most
      # recent prior run's cache since each run's save key is unique (contains run_id).
      - name: Restore DuckDB state
        uses: actions/cache/restore@v4
        with:
          path: call_report_monitor.duckdb
          key: duckdb-${{ github.run_id }}
          restore-keys: |
            duckdb-

      # Idempotent: a full replace of risk_rankings from the committed source +
      # mapping every run keeps the persisted duckdb's small-universe list in sync
      # with the repo regardless of what an earlier cached run had loaded.
      - name: Load risk-ranking reference list
        shell: bash
        run: |
          python scripts/import_risk_rankings.py data/risk-rankings.csv
          python scripts/apply_rssd_map.py

      # Explicit `shell: bash` because this uses bash conditional syntax --
      # without it, a Windows self-hosted runner defaults to PowerShell, which
      # would fail to parse `if [ ... ]; then`. Git for Windows (a checkout
      # prerequisite anyway) provides the bash GitHub Actions uses here.
      - name: Diagnose secrets (safe metadata only, no real run)
        if: ${{ inputs.diagnose_secrets == true }}
        shell: bash
        env:
          FFIEC_USER_ID: ${{ secrets.FFIEC_USER_ID }}
          FFIEC_TOKEN: ${{ secrets.FFIEC_TOKEN }}
        run: python scripts/diagnose_secrets.py

      - name: Reset poll_state cursor (temporary re-test knob)
        if: ${{ inputs.reset_cursor == true }}
        shell: bash
        run: python scripts/reset_poll_state.py

      - name: Run monitor
        if: ${{ inputs.diagnose_secrets != true }}
        shell: bash
        env:
          FFIEC_USER_ID: ${{ secrets.FFIEC_USER_ID }}
          FFIEC_TOKEN: ${{ secrets.FFIEC_TOKEN }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          # workflow_dispatch inputs are unset on a schedule-triggered run, so
          # fall back with bash's ${VAR:-default} rather than the `||` pattern
          # used elsewhere -- more reliable for an explicit-false boolean input
          # than relying on GitHub Actions' own truthiness coercion.
          HEARTBEAT_INPUT: ${{ inputs.heartbeat }}
        run: |
          HEARTBEAT_FLAG=""
          if [ "${HEARTBEAT_INPUT:-true}" != "false" ]; then
            HEARTBEAT_FLAG="--heartbeat"
          fi
          if [ "${{ inputs.fake_diff }}" = "true" ]; then
            python run.py --fake-diff
          elif [ -n "${{ inputs.max_facsimile_pulls }}" ]; then
            python run.py --universe "${{ inputs.universe || 'full' }}" \
              --max-facsimile-pulls "${{ inputs.max_facsimile_pulls }}" $HEARTBEAT_FLAG
          else
            python run.py --universe "${{ inputs.universe || 'full' }}" $HEARTBEAT_FLAG
          fi

      # Always save, even on failure, so a mid-run crash doesn't lose state already
      # written this run.
      - name: Save DuckDB state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: call_report_monitor.duckdb
          key: duckdb-${{ github.run_id }}
