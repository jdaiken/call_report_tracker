name: IntraFi Risk Monitor

# Lives in this repo (not its own) so it can use the same EMAIL_ADDRESS /
# EMAIL_APP_PASSWORD secrets as the FFIEC monitor. Code is in rates_newsletter/.
# One email every weekday morning, with the same report attached as a PDF.

on:
  schedule:
    # Weekdays 12:43 UTC = 8:43am EDT / 7:43am EST.
    - cron: "43 12 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "send = email it; dry_run = build it and upload it as an artifact, no email; check_series = test that every data source loads"
        type: choice
        options: [send, dry_run, check_series]
        default: send

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rates_newsletter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Build and send digest
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          MODE: ${{ inputs.mode }}
        run: |
          case "${MODE:-send}" in
            check_series) python run.py --check-series ;;
            dry_run)      python run.py --dry-run --out-dir out ;;
            *)            python run.py ;;
          esac

      - name: Upload preview (dry run only)
        if: ${{ inputs.mode == 'dry_run' }}
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-preview
          path: rates_newsletter/out/
