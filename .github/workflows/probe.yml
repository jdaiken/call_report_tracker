name: Probe (test)
on:
  workflow_dispatch:
    inputs:
      args:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/probe_ubpr.py ${{ inputs.args }}
